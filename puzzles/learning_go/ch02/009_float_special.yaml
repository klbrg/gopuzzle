id: "lg-ch02-009"
title: "Float Special Values: NaN and Inf"
concept: "types"
description: |
  Floating-point division has unusual behavior at the edges:
    nonzero / 0.0  ->  +Inf or -Inf
    0.0 / 0.0      ->  NaN  (Not a Number)
  Implement isSpecial(f) which returns true when f is either
  NaN or any infinity (positive or negative), and false otherwise.

      isSpecial(math.NaN())          == true
      isSpecial(math.Inf(1))         == true
      isSpecial(math.Inf(-1))        == true
      isSpecial(0.0)                 == false
      isSpecial(1.5)                 == false
template: |
  package main

  import "math"

  func isSpecial(f float64) bool {
  	// TODO: return true when f is NaN or any infinity.
  	// math.IsNaN and math.IsInf are already imported for you.
  }
test_code: |
  package main

  import (
  	"math"
  	"testing"
  )

  func TestIsSpecial(t *testing.T) {
  	cases := []struct {
  		name string
  		in   float64
  		want bool
  	}{
  		{"NaN", math.NaN(), true},
  		{"+Inf", math.Inf(1), true},
  		{"-Inf", math.Inf(-1), true},
  		{"zero", 0.0, false},
  		{"one", 1.0, false},
  		{"large", 1e308, false},
  	}
  	for _, c := range cases {
  		if got := isSpecial(c.in); got != c.want {
  			t.Errorf("isSpecial(%s): expected %v, got %v", c.name, c.want, got)
  		}
  	}
  }
hint: "math.IsNaN(f) and math.IsInf(f, 0). Passing 0 as the second arg means \"either sign\"."
solution: |
  package main

  import "math"

  func isSpecial(f float64) bool {
  	return math.IsNaN(f) || math.IsInf(f, 0)
  }
explanation: |
  IEEE 754 defines two kinds of "special" values:
    - NaN appears when a result is mathematically undefined, e.g.
      0/0 or math.Sqrt(-1).
    - +Inf and -Inf appear on overflow or division by zero.
  NaN has a unique trait: it is not equal to anything, including
  itself. So `f == math.NaN()` is always false — you must use
  math.IsNaN to detect it.
  math.IsInf takes a sign argument: 1 for +Inf, -1 for -Inf, and 0
  for "either sign".
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html"
