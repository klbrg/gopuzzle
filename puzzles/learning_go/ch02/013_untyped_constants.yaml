id: "lg-ch02-013"
title: "Untyped Constants"
concept: "constants"
kind: "predict_output"
description: |
  Predict the output. Note that `score` is declared with `const`
  but no type. Compare to what would happen if it were declared as
  `const score int = 100` — would all three `var` lines still
  compile?
snippet: |
  package main

  import "fmt"

  func main() {
  	const score = 100
  	var i int = score
  	var f float64 = score
  	var b byte = score
  	_, _ = i, f
  	fmt.Println(b)
  }
expected_output: |
  100
hint: "If `score` had an explicit type, mixing it with a different type would need a conversion (see the earlier numeric-conversion puzzles). Why doesn't this snippet hit that rule?"
explanation: |
  Because `score` has no explicit type, it is an untyped constant.
  Each `var` assignment picks the right interpretation:
    var i int = score      → score is int 100
    var f float64 = score  → score is float64 100
    var b byte = score     → score is byte 100

  If `score` were typed (`const score int = 100`), only the first
  line would compile; the others would require an explicit
  conversion like `float64(score)`.

  Rule of thumb from the chapter: keep constants untyped unless
  you have a specific reason to lock them down.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#id29"
