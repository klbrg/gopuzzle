id: "lg-ch02-008"
title: "Rune Arithmetic"
concept: "types"
description: |
  A rune is Go's type for a single Unicode code point — it's an alias
  for int32, so you can do integer arithmetic with rune literals like
  'a'.

  Implement alphabetPosition(r rune) that returns r's 1-based
  position in the alphabet, assuming r is a lowercase ASCII letter.

      alphabetPosition('a') == 1
      alphabetPosition('c') == 3
      alphabetPosition('z') == 26
template: |
  package puzzle

  func alphabetPosition(r rune) int {
  	// TODO
  }
test_code: |
  package puzzle

  import "testing"

  func TestAlphabetPosition(t *testing.T) {
  	cases := []struct {
  		in   rune
  		want int
  	}{
  		{'a', 1}, {'b', 2}, {'c', 3}, {'m', 13}, {'z', 26},
  	}
  	for _, c := range cases {
  		if got := alphabetPosition(c.in); got != c.want {
  			t.Errorf("alphabetPosition(%q): expected %d, got %d", c.in, c.want, got)
  		}
  	}
  }
hint: "A rune is just int32 — so you can do integer arithmetic with rune literals. 'a' minus 'a' is 0; what gives you 1-based instead?"
solution: |
  package puzzle

  func alphabetPosition(r rune) int {
  	return int(r - 'a' + 1)
  }
explanation: |
  Rune literals like 'a' have the numeric value of their Unicode
  code point (97 for 'a'). Because rune is just int32, arithmetic
  on runes is plain integer arithmetic.

  The chapter recommends using `rune` (not `int32`) whenever the
  value represents a character — same compiler behavior, clearer
  intent.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#string_rune"
