id: "lg-ch02-009"
title: "Strings Are Immutable"
concept: "types"
kind: "fix"
description: |
  Go strings are not what they look like — they're not mutable byte
  arrays. The code below tries to capitalise the first character by
  indexed assignment. It doesn't compile. Fix it so the program
  prints `Hello`.
template: |
  package main

  import "fmt"

  func main() {
  	s := "hello"
  	// BUG
  	s[0] = 'H'
  	fmt.Println(s)
  }
expected_output: |
  Hello
hint: "You can READ s[0] but you can't assign to it. To get a 'modified' string, build a fresh one — what part of the original can you keep?"
solution: |
  package main

  import "fmt"

  func main() {
  	s := "hello"
  	s = "H" + s[1:]
  	fmt.Println(s)
  }
explanation: |
  Strings in Go are immutable. The compiler rejects `s[0] = 'H'`
  with `cannot assign to s[0] (strings are immutable)`. To
  "modify" a string you build a NEW one and reassign — there's
  no in-place edit operation, anywhere, ever.

  Idioms for building strings:

      s = s + " more"          // concat
      s += " more"             // shorthand
      s = "H" + s[1:]          // replace first character
      s = s[:n] + s[n+1:]      // delete index n

  Each one allocates a new string and copies bytes. For loops
  that build big strings, reach for `strings.Builder` (Chapter 3)
  to avoid intermediate copies.

  Why immutable? Strings can be safely shared across goroutines
  without locks. They can be used as map keys. The runtime can
  store identical strings once (string interning is allowed by
  the spec). Mutability would break all three.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#string_rune"
