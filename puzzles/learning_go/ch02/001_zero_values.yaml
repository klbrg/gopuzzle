id: "lg-ch02-001"
title: "Zero Values"
concept: "types"
description: |
  Go assigns every declared variable a default "zero value" if you
  don't initialize it. Write a function zeroValues that returns the
  zero values for bool, int, float64, and string, in that order.
template: |
  package main

  // TODO: implement zeroValues
test_code: |
  package main

  import "testing"

  func TestZeroValues(t *testing.T) {
  	b, i, f, s := zeroValues()
  	if b != false {
  		t.Errorf("bool zero value: expected false, got %v", b)
  	}
  	if i != 0 {
  		t.Errorf("int zero value: expected 0, got %d", i)
  	}
  	if f != 0.0 {
  		t.Errorf("float64 zero value: expected 0, got %v", f)
  	}
  	if s != "" {
  		t.Errorf("string zero value: expected %q, got %q", "", s)
  	}
  }
hint: "Declare four variables with `var` and no initial value, then return them."
solution: |
  package main

  func zeroValues() (bool, int, float64, string) {
  	var b bool
  	var i int
  	var f float64
  	var s string
  	return b, i, f, s
  }
explanation: |
  In Go, a declared but uninitialized variable always has a deterministic
  default rather than being undefined. The zero values are:
    bool                 -> false
    all numeric types    -> 0
    string               -> ""
    pointers, slices,
    maps, chans, funcs,
    interfaces           -> nil
  Writing `var x T` (with no `=`) is the idiomatic way to say
  "I want the zero value of T". The explicit zero value is one of
  the things Go takes from removing a common source of C/C++ bugs.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html"
