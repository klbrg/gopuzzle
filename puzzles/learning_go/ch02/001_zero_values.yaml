id: "lg-ch02-001"
title: "Zero Values"
concept: "types"
kind: "quiz"
description: |
  Go assigns every declared variable a default "zero value" if you
  don't initialize it. The value Go picks depends on the type.

  Pick the option that correctly names the zero values for bool,
  int, string, and pointer (in that order).
question: "Which row lists the correct zero values for bool, int, string, and pointer?"
choices:
  - 'false, 0, "", nil'
  - 'false, 0, nil, nil'
  - 'false, 0, "", 0'
  - '0, 0, "", nil'
answer: 'false, 0, "", nil'
hint: "Go's zero values come from one consistent rule: pick the value that means 'nothing of that type'. Each WRONG row gets one element wrong in a way that mirrors a different language's convention. Spot the row where ALL four match Go."
explanation: |
  Zero values for the predeclared types:
    bool                 -> false
    all numeric types    -> 0
    string               -> ""
    pointers, slices,
    maps, chans, funcs,
    interfaces           -> nil

  `var x T` (with no `=`) declares a variable at its type's zero
  value. The explicit zero value is one of the design decisions
  that removes a whole class of bugs from C and C++ programs.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#id16"
