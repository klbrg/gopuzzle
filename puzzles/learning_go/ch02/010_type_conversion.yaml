id: "lg-ch02-010"
title: "Explicit Type Conversion"
concept: "types"
kind: "fix"
description: |
  Go does not auto-promote between numeric types. Mixing an int with
  a float64 in an expression is a compile error — you must convert
  explicitly with `TypeName(value)`.

  The code below tries to add an int to a float64 and store the
  result in a float64 variable. As written it won't compile. Fix
  the assignment so the program compiles and prints the sum.
template: |
  package main

  import "fmt"

  func main() {
  	var x int = 10
  	var y float64 = 30.5
  	// TODO: fix this line — int can't be added to float64 without converting.
  	var sum float64 = x + y
  	fmt.Println(sum)
  }
expected_output: |
  40.5
hint: "Wrap x in float64(...) so both operands are the same type before the +."
solution: |
  package main

  import "fmt"

  func main() {
  	var x int = 10
  	var y float64 = 30.5
  	var sum float64 = float64(x) + y
  	fmt.Println(sum)
  }
explanation: |
  Writing `x + y` where x is int and y is float64 is a compile
  error: Go does not auto-promote. Convert at least one operand
  with an explicit cast — typically widening from int to float64
  to preserve precision:
    float64(x) + y

  This rule applies to all numeric types, including different-
  sized integers (int vs int32, byte vs int) and different
  signedness.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html"
