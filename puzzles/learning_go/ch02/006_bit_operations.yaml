  	// TODO
  }
test_code: |
  package puzzle

  import "testing"

  func TestToggleBit(t *testing.T) {
  	cases := []struct {
  		n, pos, want int
  	}{
  		{0, 0, 1},
  		{0, 3, 8},
  		{0b0101, 0, 0b0100},
  		{0b0101, 2, 0b0001},
  		{0xFF, 4, 0xEF},
  	}
  	for _, c := range cases {
  		if got := toggleBit(c.n, c.pos); got != c.want {
  			t.Errorf("toggleBit(%b, %d): expected %b, got %b", c.n, c.pos, c.want, got)
  		}
  	}
  }
hint: "Of Go's bitwise operators, which one flips a bit when XOR'd with 1 and leaves it alone when XOR'd with 0? Combine that with a shift to position the 1."
solution: |
  package puzzle

  func toggleBit(n int, pos int) int {
  	return n ^ (1 << pos)
  }
explanation: |
  XOR (^) flips every bit where the mask has a 1 and leaves the rest
  unchanged. To flip exactly one bit, build a mask with that bit
  set: `1 << pos`.

  Related patterns:
    set a bit       n | (1 << pos)
    clear a bit     n &^ (1 << pos)    // AND NOT
    test a bit      n & (1 << pos) != 0
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#id22"
