id: "lg-ch02-006"
title: "Bit Operations"
concept: "types"
description: |
  Go's bitwise operators on integers: & (AND), | (OR), ^ (XOR),
  &^ (AND NOT), << (left shift), >> (right shift).

  Implement toggleBit(n, pos) that flips the bit at position pos
  in n (position 0 is the least significant bit).

      toggleBit(0b0000, 0) == 0b0001
      toggleBit(0b0101, 0) == 0b0100
      toggleBit(0b0101, 2) == 0b0001
template: |
