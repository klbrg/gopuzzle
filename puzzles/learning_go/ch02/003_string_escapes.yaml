id: "lg-ch02-003"
title: "Interpreted String Escapes"
concept: "types"
kind: "predict_output"
description: |
  Interpreted string literals use double quotes and process backslash
  escapes. Inside one, `\\` means a literal backslash and `\"` means
  a literal double quote.

  Predict the output.
snippet: |
  package main

  import "fmt"

  func main() {
  	fmt.Print("a \"b\" c\\d")
  }
expected_output: |
  a "b" c\d
hint: "Each backslash-escape turns into one character: `\\\"` produces `\"`, `\\\\` produces `\\`."
explanation: |
  Inside double-quoted strings, the most common backslash escapes:
    \n   newline
    \t   tab
    \\   literal backslash
    \"   literal double quote

  Compare with raw string literals (backticks), which include every
  character between the backticks verbatim — no escape processing.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#goliterals"
