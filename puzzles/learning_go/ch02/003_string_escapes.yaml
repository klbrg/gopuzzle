id: "lg-ch02-003"
title: "Interpreted String Escapes"
concept: "types"
kind: "quiz"
description: |
  The script below uses a double-quoted (interpreted) string
  literal with backslash escapes. Which line does it print?
question: 'What does `fmt.Print("a \"b\" c\\d")` print?'
choices:
  - 'a \"b\" c\\d'
  - 'a "b" c\d'
  - 'a b c d'
  - 'compile error — backslash and double quote aren''t valid inside double quotes'
answer: 'a "b" c\d'
hint: "Each `\\X` in the source produces ONE character in the output. Count source backslash-escapes vs printed characters."
explanation: |
  Inside double-quoted strings, the most common backslash escapes:
    \n   newline
    \t   tab
    \\   literal backslash
    \"   literal double quote

  So `"a \"b\" c\\d"` produces `a "b" c\d` (six printable
  characters plus the spaces).

  Compare with raw string literals (backticks), which include every
  character between the backticks verbatim — no escape processing.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#goliterals"
