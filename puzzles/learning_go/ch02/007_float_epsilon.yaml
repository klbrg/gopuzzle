id: "lg-ch02-007"
title: "Comparing Floats With Epsilon"
concept: "types"
description: |
  Floating-point math is inexact, so == on floats is dangerous —
  values that "should" be equal often differ by a tiny rounding
  error. The chapter's advice is to define a tolerance (epsilon)
  and test that |a - b| is less than it.

  Implement floatsClose(a, b, epsilon) returning true when the
  absolute difference between a and b is less than epsilon.

      floatsClose(0.1+0.2, 0.3, 1e-9) == true
      floatsClose(1.0, 1.1, 0.01)     == false
template: |
  package main

  import "math"

  func floatsClose(a, b, epsilon float64) bool {
  	// TODO: return whether a and b are within epsilon of each other.
  }
test_code: |
  package main

  import "testing"

  func TestFloatsClose(t *testing.T) {
  	cases := []struct {
  		a, b, eps float64
  		want      bool
  	}{
  		{0.1 + 0.2, 0.3, 1e-9, true},
  		{1.0, 1.0, 1e-9, true},
  		{1.0, 1.1, 0.01, false},
  		{1.0, 1.001, 0.01, true},
  		{-1.0, -1.0001, 1e-3, true},
  		{-1.0, 1.0, 0.5, false},
  	}
  	for _, c := range cases {
  		if got := floatsClose(c.a, c.b, c.eps); got != c.want {
  			t.Errorf("floatsClose(%v, %v, %v): expected %v, got %v",
  				c.a, c.b, c.eps, c.want, got)
  		}
  	}
  }
hint: "Use math.Abs(a - b) and compare to epsilon. The import is already in the template."
solution: |
  package main

  import "math"

  func floatsClose(a, b, epsilon float64) bool {
  	return math.Abs(a-b) < epsilon
  }
explanation: |
  Go uses IEEE 754, which is precise but cannot represent every
  decimal exactly. `0.1 + 0.2` is 0.30000000000000004, not 0.3, so
  `==` says they're different even when they're mathematically
  equal. Pick an epsilon appropriate to your needs (1e-9 is a
  reasonable default).

  The same caution applies to ordering — never rely on bit-exact
  comparisons of computed floats.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#id23"
