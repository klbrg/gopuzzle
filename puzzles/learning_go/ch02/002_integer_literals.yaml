id: "lg-ch02-002"
title: "Integer Literals in Different Bases"
concept: "types"
kind: "predict_output"
description: |
  Predict the output. Each of the three literals has a prefix that
  tells the compiler what base to read it in.
snippet: |
  package main

  import "fmt"

  func main() {
  	fmt.Println(0o17)
  }
expected_output: |
  15
hint: "The three prefixes are the same as in C-family languages. One you use every day for colour codes (`0x`), one comes from binary representation, and one comes from POSIX file modes."
explanation: |
  Integer literals can be written in four bases by their prefix:
    base 10 (no prefix)  1234
    binary  (0b / 0B)    0b1010   == 10
    octal   (0o / 0O)    0o17     == 15
    hex     (0x / 0X)    0x10     == 16

  Underscores are allowed inside any literal for readability, e.g.
  `0b1111_0000` or `1_000_000`. Pick the base that makes the
  intent clearest: hex for bytes/bit patterns, octal for POSIX
  permissions, binary when you really mean bits.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#goliterals"
