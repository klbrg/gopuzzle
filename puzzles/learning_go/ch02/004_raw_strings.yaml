id: "lg-ch02-004"
title: "Raw String Literals"
concept: "types"
kind: "quiz"
description: |
  The script uses a BACKTICK-delimited raw string literal. Which
  line does it print?

      fmt.Print(`a \"b\" c\\d`)
question: "What does the snippet print?"
choices:
  - 'a "b" c\d'
  - 'a \"b\" c\\d'
  - 'a b c d'
  - 'compile error — raw strings can''t contain backslashes'
answer: 'a \"b\" c\\d'
hint: "Backticks change everything about how the literal is interpreted. What other use case for backticks would be broken if `\\n` was treated as a newline?"
explanation: |
  Backtick-delimited raw strings do no escape interpretation:
    `\n`    is the two characters backslash and n
    `\"`    is the two characters backslash and double-quote
    `\\`    is the two characters backslash and backslash

  Useful when the text contains many backslashes (regex, Windows
  paths), many double quotes (HTML, JSON, SQL), or spans multiple
  lines. The only character a raw string cannot contain is a
  backtick.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#goliterals"
