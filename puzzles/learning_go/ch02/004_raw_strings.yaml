id: "lg-ch02-004"
title: "Raw String Literals"
concept: "types"
kind: "predict_output"
description: |
  Raw string literals are delimited by backticks and include every
  character verbatim — no escape processing.

  Predict the output. The input text looks like the previous puzzle
  but the delimiter is different.
snippet: |
  package main

  import "fmt"

  func main() {
  	fmt.Print(`a \"b\" c\\d`)
  }
expected_output: |
  a \"b\" c\\d
hint: "Inside backticks every character appears literally — backslashes and quotes are not interpreted."
explanation: |
  Backtick-delimited raw strings do no interpretation:
    `\n`    is the two characters backslash and n
    `\"`    is the two characters backslash and double-quote
    `\\`    is the two characters backslash and backslash

  They are useful when the text contains many backslashes (regex,
  Windows paths), many double quotes (HTML, JSON, SQL), or spans
  multiple lines. The only character a raw string cannot contain
  is a backtick.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch02.html#goliterals"
