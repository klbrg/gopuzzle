id: "lg-review-007"
title: "Split by Parity"
concept: "slices + control flow"
description: |
  Implement `partition(nums []int) (evens, odds []int)`. Return two
  slices: the even values and the odd values, each in their original
  order. Return empty (non-nil) slices when there's nothing to put in
  them.

      partition([]int{1, 2, 3, 4, 5})  ==  []int{2, 4}, []int{1, 3, 5}
      partition([]int{-2, -3, 0})      ==  []int{-2, 0}, []int{-3}
      partition([]int{})               ==  []int{}, []int{}

  The return signature is fixed.
template: |
  package puzzle

  func partition(nums []int) (evens, odds []int) {
  	// TODO
  }
test_code: |
  package puzzle

  import (
  	"slices"
  	"testing"
  )

  func TestPartition(t *testing.T) {
  	cases := []struct {
  		name      string
  		in        []int
  		wantEvens []int
  		wantOdds  []int
  	}{
  		{"mixed", []int{1, 2, 3, 4, 5}, []int{2, 4}, []int{1, 3, 5}},
  		{"negatives and zero", []int{-2, -3, 0}, []int{-2, 0}, []int{-3}},
  		{"all even", []int{2, 4, 6}, []int{2, 4, 6}, []int{}},
  		{"all odd", []int{1, 3}, []int{}, []int{1, 3}},
  		{"empty", []int{}, []int{}, []int{}},
  	}
  	for _, c := range cases {
  		evens, odds := partition(c.in)
  		if evens == nil || odds == nil {
  			t.Errorf("%s: returned a nil slice; want non-nil", c.name)
  			continue
  		}
  		if !slices.Equal(evens, c.wantEvens) {
  			t.Errorf("%s: evens = %v, want %v", c.name, evens, c.wantEvens)
  		}
  		if !slices.Equal(odds, c.wantOdds) {
  			t.Errorf("%s: odds = %v, want %v", c.name, odds, c.wantOdds)
  		}
  	}
  }
hint: "Initialise both return slices to empty literals (`[]int{}`) so the no-match cases stay non-nil, then range once and append each value to the right slice. Careful with negative odds: in Go `-3 % 2` is `-1`, so test against `!= 0`, not `== 1`."
solution: |
  package puzzle

  func partition(nums []int) (evens, odds []int) {
  	evens, odds = []int{}, []int{}
  	for _, n := range nums {
  		if n%2 == 0 {
  			evens = append(evens, n)
  		} else {
  			odds = append(odds, n)
  		}
  	}
  	return evens, odds
  }
explanation: |
  A straightforward single pass that nonetheless trips two common
  wires:

  - **Non-nil empties** (Ch3): seeding `evens` and `odds` with
    `[]int{}` means the "all even" and "empty input" cases return an
    empty-but-non-nil slice, which the tests require. If you left them
    as the nil zero value, `all odd` would hand back a nil `evens`.
  - **Negative modulo** (Ch2/Ch4): Go's `%` keeps the sign of the
    dividend, so `-3 % 2 == -1`. Testing `n%2 == 1` would
    misclassify negative odds as even. Test `n%2 == 0` for even and
    let everything else be odd, or compare against `!= 0`.

  Ranging once and appending preserves input order in both outputs —
  no sorting needed.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch04.html#for_range"
