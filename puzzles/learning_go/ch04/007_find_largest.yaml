id: "lg-ch04-007"
title: "Second Largest"
concept: "loops"
description: |
  `slices.Max(nums)` gives you the maximum element. What about
  the SECOND largest? You can't just sort and pick index -2 —
  that's O(n log n) when O(n) is enough — and the off-by-one
  traps around duplicates and small slices are real.

  Implement `secondLargest(nums)` that returns the second-largest
  element in the slice. Duplicates of the maximum count toward
  "second" — i.e. if the sorted-descending order is `[9, 9, 6, 2]`,
  the second largest is `9`.

  You may assume `len(nums) >= 2`.

      secondLargest([]int{3, 1, 4, 1, 5, 9, 2, 6})  == 6
      secondLargest([]int{9, 9, 6})                  == 9
      secondLargest([]int{1, 2})                     == 1
      secondLargest([]int{-5, -10, -3})              == -5
      secondLargest([]int{5, 5})                     == 5
