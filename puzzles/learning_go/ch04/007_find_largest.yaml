test_code: |
  package puzzle

  import "testing"

  func TestSecondLargest(t *testing.T) {
  	cases := []struct {
  		name string
  		in   []int
  		want int
  	}{
  		{"classic", []int{3, 1, 4, 1, 5, 9, 2, 6}, 6},
  		{"duplicates of max count", []int{9, 9, 6}, 9},
  		{"all duplicates", []int{5, 5}, 5},
  		{"length 2 ascending", []int{1, 2}, 1},
  		{"length 2 descending", []int{2, 1}, 1},
  		{"length 2 equal", []int{7, 7}, 7},
  		{"all negatives", []int{-5, -10, -3}, -5},
  		{"max appears last", []int{1, 2, 3}, 2},
  		{"max appears first", []int{10, 1, 2}, 2},
  		{"large slice", []int{4, 4, 4, 4, 5}, 4},
  	}
  	for _, c := range cases {
  		if got := secondLargest(c.in); got != c.want {
  			t.Errorf("%s: secondLargest(%v) = %d, want %d", c.name, c.in, got, c.want)
  		}
  	}
  }
hint: "Track TWO running values: `first` (best so far) and `second` (best so far that isn't strictly bigger than first). Seed both with `math.MinInt` so any real number replaces them. On each new element decide: does it dethrone `first`, replace `second`, or get ignored?"
solution: |
  package puzzle

  import "math"

  func secondLargest(nums []int) int {
  	first, second := math.MinInt, math.MinInt
  	for _, n := range nums {
  		if n > first {
  			second = first
  			first = n
  		} else if n > second {
  			second = n
  		}
  	}
  	return second
  }
explanation: |
  The trick is the SEED. If you start `first, second := nums[0], nums[0]`,
  the case `[2, 1]` breaks: `first=2, second=2`, then `n=1` doesn't
  beat either, so `second` stays at the bogus seed value `2`.
  Returns `2`, want `1`.

  Seeding both with `math.MinInt` lets the first iteration genuinely
  populate `first`, and the second iteration populate `second`
  (because any real number > `MinInt`). Duplicates of `first` slot
  into `second` correctly:

      [9, 9, 6]   → first=9, second=MinInt; then second=9 (the
                    second 9 dethrones MinInt); then 6 < 9
                    twice, no change                → return 9
      [5, 5]      → first=5, second=MinInt; then second=5  → return 5
      [2, 1]      → first=2, second=MinInt; then second=1  → return 1

  This is a one-pass O(n) algorithm with two integers of state.
  Compare to sort-and-pick which is O(n log n) and allocates a
  copy of the slice. For "top K" generalisations, look at
  `container/heap` for a min-heap of size K.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch04.html#id226"
