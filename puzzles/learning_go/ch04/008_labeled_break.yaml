id: "lg-ch04-008"
title: "Labeled break Out of Nested Loops"
concept: "loops"
description: |
  A plain `break` inside a nested loop only exits the inner loop.
  To break out of an outer loop too, label the outer loop and use
  `break label`:

      outer:
          for i := range rows {
              for j := range cols {
                  if found(i, j) {
                      break outer   // exits both loops
                  }
              }
          }

  Implement `findInGrid(grid, target)` that returns the `(row, col)`
  of the first occurrence of `target` in row-major order. Return
  `(-1, -1)` if `target` isn't present.

      findInGrid([][]int{{1,2,3},{4,5,6}}, 5)  == (1, 1)
      findInGrid([][]int{{1,2,3},{4,5,6}}, 99) == (-1, -1)
      findInGrid([][]int{{1,2},{1,3}}, 1)      == (0, 0)
