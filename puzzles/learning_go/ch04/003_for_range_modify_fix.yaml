id: "lg-ch04-003"
title: "for-range Loop Variable Is a Copy"
concept: "loops"
kind: "fix"
description: |
  The code below tries to double each element of `nums`. Run it
  as-is — the print doesn't match `[2 4 6]`. Fix it.
template: |
  package main

  import "fmt"

  func main() {
  	nums := []int{1, 2, 3}
  	// BUG
  	for _, n := range nums {
  		n *= 2
  	}
  	fmt.Println(nums)
  }
expected_output: |
  [2 4 6]
hint: "Add `fmt.Println(nums)` BEFORE the loop and AFTER to see what changed. Is `n` actually the same memory as `nums[i]`?"
solution: |
  package main

  import "fmt"

  func main() {
  	nums := []int{1, 2, 3}
  	for i := range nums {
  		nums[i] *= 2
  	}
  	fmt.Println(nums)
  }
explanation: |
  In `for i, v := range slice`, `v` is a fresh local variable that
  receives a copy of `slice[i]` on each iteration. Writing to `v`
  changes that local copy, not the underlying slice.

  To mutate the slice itself you have to address it by index:

      for i := range nums {
          nums[i] *= 2
      }

  The same gotcha applies to ranging over maps and arrays: the
  value variable is always a copy. If you need to mutate, work
  through the index or key.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch04.html#for_range_copy"
