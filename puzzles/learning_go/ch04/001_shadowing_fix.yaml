id: "lg-ch04-001"
title: "Shadowing Bug"
concept: "blocks"
kind: "fix"
description: |
  The code below sets `count` to 3 inside an `if` block, then prints
  `count`. Run it as-is to see what actually gets printed. Then fix
  it so the program prints `3`.
template: |
  package main

  import "fmt"

  func main() {
  	count := 0
  	if true {
  		// BUG
  		count := 3
  		_ = count
  	}
  	fmt.Println(count)
  }
expected_output: |
  3
hint: "What's the difference between `:=` and `=`? One of them DECLARES a new variable; the other ASSIGNS to an existing one. Which do you actually want inside the if block?"
solution: |
  package main

  import "fmt"

  func main() {
  	count := 0
  	if true {
  		count = 3
  	}
  	fmt.Println(count)
  }
explanation: |
  `:=` is the short declaration operator: it declares a NEW variable.
  When you use it inside a nested block with the same name as an
  outer variable, you create a fresh inner variable that lives only
  for that block. The outer variable is unchanged — it's just
  temporarily hidden.

  To assign to the existing outer variable, use `=` (plain
  assignment) instead.

  This trap shows up often with `if err := foo(); err != nil { ... }`
  patterns when you accidentally re-declare `err` in a nested block.
  Tools like `go vet -shadow` and linters in `golangci-lint` can
  flag shadowing if you enable them.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch04.html#shadowing"
