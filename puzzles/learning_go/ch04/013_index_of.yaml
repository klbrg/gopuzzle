id: "lg-ch04-013"
title: "All Indices of a Target"
concept: "loops"
description: |
  `slices.Index` returns the first occurrence of a value. Real
  code often needs ALL occurrences — for highlighting, batch
  deletion, or auditing. Implement that.

  `allIndices(nums, target)` returns a slice of every index at
  which `target` appears in `nums`, in order. Return an empty
  slice (not nil) when there are no matches OR when `nums` is
  empty / nil.

      allIndices([]int{10, 20, 30, 20}, 20) == []int{1, 3}
      allIndices([]int{1, 1, 1}, 1)         == []int{0, 1, 2}
      allIndices([]int{1, 2, 3}, 5)         == []int{}
      allIndices(nil, 1)                    == []int{}
template: |
  package puzzle

  func allIndices(nums []int, target int) []int {
  	// TODO
  }
test_code: |
  package puzzle

  import (
  	"slices"
  	"testing"
  )

  func TestAllIndices(t *testing.T) {
  	cases := []struct {
  		name    string
  		nums    []int
  		target  int
  		want    []int
  	}{
  		{"two matches", []int{10, 20, 30, 20}, 20, []int{1, 3}},
  		{"all match", []int{1, 1, 1}, 1, []int{0, 1, 2}},
  		{"no matches", []int{1, 2, 3}, 5, []int{}},
  		{"nil slice", nil, 1, []int{}},
  		{"empty slice", []int{}, 1, []int{}},
  		{"single match at start", []int{5, 1, 2}, 5, []int{0}},
  		{"single match at end", []int{1, 2, 5}, 5, []int{2}},
  		{"alternating", []int{0, 1, 0, 1, 0}, 0, []int{0, 2, 4}},
  	}
  	for _, c := range cases {
  		got := allIndices(c.nums, c.target)
  		if got == nil {
  			t.Errorf("%s: returned nil; tests expect a non-nil empty slice for the no-match case", c.name)
  			continue
  		}
  		if !slices.Equal(got, c.want) {
  			t.Errorf("%s: got %v, want %v", c.name, got, c.want)
  		}
  	}
  }
hint: "Initialise the result with a non-nil empty slice (`[]int{}`, not `var result []int`) so the 'no matches' case still returns non-nil. Then append the index every time you find a match."
solution: |
  package puzzle

  func allIndices(nums []int, target int) []int {
  	result := []int{}
  	for i, n := range nums {
  		if n == target {
  			result = append(result, i)
  		}
  	}
  	return result
  }
explanation: |
  The nil-vs-empty distinction matters here: `var result []int`
  gives you a nil slice, and the "no match" path would return
  nil. The tests treat that as a bug — the contract says "empty
  slice", not nil.

  Why pick that contract? It's friendlier for callers who want to
  `range` (both behave the same) but want to also write code like
  `result = append(result, ...)` later without first checking for
  nil. And it serialises cleanly to `[]` in JSON instead of `null`.

  Performance notes:

  - `append` to a non-nil empty slice still grows the same way as
    appending to nil; there's no penalty for the `[]int{}`
    initialisation in the no-match case.
  - If you know an upper bound on matches, pre-size with
    `make([]int, 0, len(nums))` to avoid intermediate reallocs.

  Go 1.21+ added `slices.Index(nums, target)` for the first-only
  version, but there's no built-in `slices.IndexAll`. Useful
  building block to keep around.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch04.html#for_range"
