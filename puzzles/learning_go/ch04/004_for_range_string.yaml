id: "lg-ch04-004"
title: "for-range Over a UTF-8 String"
concept: "loops"
kind: "predict_output"
description: |
  When you `range` over a string, Go decodes the UTF-8 bytes into
  runes — so the iteration count is the number of CODE POINTS, not
  bytes. `len(s)` still returns the byte count.

  Predict the output. For reference, the character `é` takes 2 bytes
  in UTF-8; plain ASCII letters take 1 byte each.
snippet: |
  package main

  import "fmt"

  func main() {
  	s := "héllo"
  	count := 0
  	for range s {
  		count++
  	}
  	fmt.Println(count, len(s))
  }
expected_output: |
  5 6
hint: "Count the visible characters of 'héllo' first (that's the rune count). Then count the bytes — only `é` is multi-byte."
explanation: |
  `for range s` iterates once per Unicode code point, decoding UTF-8
  as it goes. "héllo" is 5 runes (h, é, l, l, o) so the counter
  reaches 5.

  `len(s)` returns the byte length of the underlying string. Four
  of the runes are 1 byte each; `é` is 2 bytes in UTF-8; total 6.

  If you want the index, use `for i, r := range s`. `i` jumps by
  however many bytes the previous rune occupied (1 or more) — not
  by 1.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch04.html#id227"
