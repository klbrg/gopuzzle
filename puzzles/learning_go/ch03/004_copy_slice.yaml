id: "lg-ch03-004"
title: "Independent Slice Copy"
concept: "slices"
kind: "fix"
description: |
  The code below assigns `b := a`, mutates `b`, and expects `a` to
  be untouched. Run it as-is to see what actually happens. Then fix
  it so `a` prints `[1 2 3]`.
template: |
  package main

  import "fmt"

  func main() {
  	a := []int{1, 2, 3}
  	// BUG
  	b := a
  	b[0] = 99
  	fmt.Println(a)
  }
expected_output: |
  [1 2 3]
hint: "`b := a` copies the slice HEADER, not the elements. To get independent elements you need a fresh backing array — what built-in does that, and what built-in fills it?"
solution: |
  package main

  import "fmt"

  func main() {
  	a := []int{1, 2, 3}
  	b := make([]int, len(a))
  	copy(b, a)
  	b[0] = 99
  	fmt.Println(a)
  }
explanation: |
  `b := a` copies the slice header (pointer + length + capacity), not
  the elements. Both variables now reference the same backing array,
  so writing through one shows up in the other.

  `copy(dst, src)` copies as many elements as `min(len(dst), len(src))`
  allows. To get a full independent copy:
    b := make([]int, len(a))
    copy(b, a)

  Since Go 1.21, `slices.Clone(a)` from the standard library does the
  same thing in one call — handy when you have it available.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#copy_slice"
