id: "lg-ch03-014"
title: "Merge Two Persons"
concept: "structs"
description: |
  A common pattern in config layering and partial updates: take
  two records of the same type, return a record where each field
  is taken from the SECOND if non-zero, otherwise from the FIRST.
  "Non-zero" means the field's value differs from its type's zero
  value.

  Implement `merge(base, override Person) Person`. For each field
  on `override` that is non-zero, use it; otherwise fall back to
  the corresponding field on `base`.

      merge(Person{"Alice", 30}, Person{Name: "Bob"})       == Person{"Bob", 30}
      merge(Person{"Alice", 30}, Person{Age: 99})           == Person{"Alice", 99}
      merge(Person{"Alice", 30}, Person{})                  == Person{"Alice", 30}
      merge(Person{}, Person{"Carol", 40})                  == Person{"Carol", 40}
      merge(Person{"Alice", 30}, Person{"Bob", 25})         == Person{"Bob", 25}
template: |
  package puzzle

  type Person struct {
  	Name string
  	Age  int
  }

  func merge(base, override Person) Person {
  	// TODO
  }
test_code: |
  package puzzle

  import "testing"

  func TestMerge(t *testing.T) {
  	cases := []struct {
  		name           string
  		base, override Person
  		want           Person
  	}{
  		{"override name only", Person{"Alice", 30}, Person{Name: "Bob"}, Person{"Bob", 30}},
  		{"override age only", Person{"Alice", 30}, Person{Age: 99}, Person{"Alice", 99}},
  		{"empty override keeps base", Person{"Alice", 30}, Person{}, Person{"Alice", 30}},
  		{"empty base takes override", Person{}, Person{"Carol", 40}, Person{"Carol", 40}},
  		{"both fields overridden", Person{"Alice", 30}, Person{"Bob", 25}, Person{"Bob", 25}},
  		{"both empty", Person{}, Person{}, Person{}},
  		{"override age is zero, base keeps", Person{"Alice", 30}, Person{Name: "Bob", Age: 0}, Person{"Bob", 30}},
  	}
  	for _, c := range cases {
  		got := merge(c.base, c.override)
  		if got != c.want {
  			t.Errorf("%s: merge(%+v, %+v) = %+v, want %+v", c.name, c.base, c.override, got, c.want)
  		}
  	}
  }
hint: "Two field-by-field checks against each field's zero value. Modify `base` (it's a copy — Go passes structs by value) and return it. Watch out: the test cases distinguish 'Age = 0 means use base' from 'Age was explicitly set'."
solution: |
  package puzzle

  type Person struct {
  	Name string
  	Age  int
  }

  func merge(base, override Person) Person {
  	if override.Name != "" {
  		base.Name = override.Name
  	}
  	if override.Age != 0 {
  		base.Age = override.Age
  	}
  	return base
  }
explanation: |
  Struct arguments are passed BY VALUE in Go, so `base` is your
  own local copy — mutating it doesn't affect the caller. Set the
  fields you want and return.

  This puzzle exposes a real-world wart: there's no way to tell
  "the caller explicitly set Age to 0" from "the caller didn't
  set Age at all". Both look like `Age: 0`. If you genuinely
  need to distinguish them, the standard tricks are:

    - **Pointer fields**: `Age *int`. nil = not set, &0 = set to 0.
    - **Wrapper types**: a `Maybe[T]` or `option` type with a `Set` bool.
    - **JSON tags + raw messages**: parse with `json.RawMessage` so
      you can ask "was the key even present?"

  The puzzle's spec — "non-zero wins" — is a simplification, but
  it's exactly the rule used by lots of real config-merging code
  (Viper, mergo, similar). It works fine as long as zero genuinely
  isn't a meaningful value for the field.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#struct_first_look"
