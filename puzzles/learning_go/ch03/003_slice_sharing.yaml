id: "lg-ch03-003"
title: "Slices Share Memory"
concept: "slices"
kind: "predict_output"
description: |
  Predict the output of `fmt.Println(x)` after `y[0] = 99`.
snippet: |
  package main

  import "fmt"

  func main() {
  	x := []int{1, 2, 3, 4}
  	y := x[1:3]
  	y[0] = 99
  	fmt.Println(x[1])
  }
expected_output: |
  99
hint: "What does `x[1:3]` actually return? A slice is a small header — does the act of slicing allocate a new array, or reuse the existing one?"
explanation: |
  `x[1:3]` returns a slice with length 2 that shares the same backing
  array as `x` — it just records a different start, length, and
  capacity. `y[0]` and `x[1]` are literally the same memory cell.

  This is THE classic Go slice gotcha. Two ways to avoid it:
    - Use `copy` to make an independent slice when you need one.
    - Use a full slice expression `s[a:b:b]` to cap the subslice's
      capacity at its length, so any future append on the subslice
      allocates rather than overwriting the parent's data.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#id36"
