id: "lg-ch03-010"
title: "Cascading Lookup"
concept: "maps"
description: |
  Many configuration systems look up a key through layered
  sources in priority order: command-line flags, environment
  variables, on-disk config, hard-coded defaults. The first
  layer that HAS the key wins; missing layers fall through.

  Implement `cascadingLookup(layers, key)` that walks
  `layers` in order, returns the value from the first map that
  contains `key`, and reports whether any layer had it.

      cascadingLookup([
          {"port": 9000},          // highest priority
          {"port": 8080, "host": "localhost"},
          {"host": "0.0.0.0"},
      ], "port")                   == (9000, true)

      cascadingLookup([
          {"port": 9000},
          {"port": 8080, "host": "localhost"},
          {"host": "0.0.0.0"},
      ], "host")                   == ("localhost", true)

      cascadingLookup([{"a": 1}], "missing")  == (0, false)
      cascadingLookup(nil, "x")               == (0, false)
template: |
