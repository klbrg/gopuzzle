id: "lg-ch03-010"
title: "The comma ok Idiom"
concept: "maps"
description: |
  Reading a map with a single variable always returns a value — even
  when the key is missing (you get the zero value). To distinguish
  "key missing" from "key present with the zero value", read with two
  variables: `v, ok := m[key]`. The second one is a bool that's true
  exactly when the key is in the map.

  Implement `lookup(m, key)` that returns the value associated with
  `key` and a bool indicating whether the key was present.

      lookup({"a": 1, "b": 0}, "a") == (1, true)
      lookup({"a": 1, "b": 0}, "b") == (0, true)   // present, value happens to be zero
      lookup({"a": 1, "b": 0}, "c") == (0, false)
template: |
  package main

  func lookup(m map[string]int, key string) (int, bool) {
  	// TODO: return both the value and whether the key was present.
  }
test_code: |
  package main

  import "testing"

  func TestLookup(t *testing.T) {
  	m := map[string]int{"a": 1, "b": 0, "c": -5}
  	cases := []struct {
  		key    string
  		wantV  int
  		wantOK bool
  	}{
  		{"a", 1, true},
  		{"b", 0, true},
  		{"c", -5, true},
  		{"missing", 0, false},
  		{"", 0, false},
  	}
  	for _, c := range cases {
  		v, ok := lookup(m, c.key)
  		if v != c.wantV || ok != c.wantOK {
  			t.Errorf("lookup(%q): got (%d, %v), want (%d, %v)",
  				c.key, v, ok, c.wantV, c.wantOK)
  		}
  	}
  }
hint: "`v, ok := m[key]` does exactly this — just return both."
solution: |
  package main

  func lookup(m map[string]int, key string) (int, bool) {
  	v, ok := m[key]
  	return v, ok
  }
explanation: |
  The two-variable form of a map read is built into the language —
  there's no API to opt into, no special function. The compiler
  recognizes the shape and synthesizes the `ok` bool.

  This same comma-ok shape shows up later for:
    - Channel receives: `v, ok := <-ch` (ok is false if the channel is closed)
    - Type assertions: `v, ok := x.(int)` (ok is false if the assertion would have panicked)

  Reading without the bool: `v := m[key]` is fine when you don't care
  about presence — useful with counter maps where 0 is the right
  default.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html"
