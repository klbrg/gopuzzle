test_code: |
  package puzzle

  import "testing"

  func TestCascadingLookup(t *testing.T) {
  	layers := []map[string]int{
  		{"port": 9000},
  		{"port": 8080, "host": 1024},
  		{"host": 80},
  	}
  	cases := []struct {
  		name   string
  		layers []map[string]int
  		key    string
  		wantV  int
  		wantOK bool
  	}{
  		{"first layer wins", layers, "port", 9000, true},
  		{"second layer wins when first lacks", layers, "host", 1024, true},
  		{"missing in every layer", layers, "missing", 0, false},
  		{"nil layers", nil, "x", 0, false},
  		{"empty layers", []map[string]int{}, "x", 0, false},
  		{"zero-value present beats missing", []map[string]int{{"x": 0}}, "x", 0, true},
  		{"single layer hit", []map[string]int{{"x": 5}}, "x", 5, true},
  	}
  	for _, c := range cases {
  		v, ok := cascadingLookup(c.layers, c.key)
  		if v != c.wantV || ok != c.wantOK {
  			t.Errorf("%s: got (%d, %v), want (%d, %v)", c.name, v, ok, c.wantV, c.wantOK)
  		}
  	}
  }
hint: "You need to distinguish 'this layer doesn't have the key' from 'this layer has the key with value 0'. The comma-ok form of a map read is the only way to tell them apart. Return as soon as you find a hit."
solution: |
  package puzzle

  func cascadingLookup(layers []map[string]int, key string) (int, bool) {
  	for _, m := range layers {
  		if v, ok := m[key]; ok {
  			return v, true
  		}
  	}
  	return 0, false
  }
explanation: |
  The puzzle's trap: if you write `if v := m[key]; v != 0`, you
  silently treat "missing" and "value happens to be zero" as the
  same case. The "zero-value present beats missing" test case
  exercises that — `{"x": 0}` HAS the key (so we return
  `(0, true)`), and you can only see that with comma-ok.

  This is exactly why Go made the comma-ok form part of the
  language rather than relying on a sentinel value: zero is a
  legitimate value, not a "not found" marker.

  Same pattern shows up for:
    - Channel receives: `v, ok := <-ch` (ok is false if channel closed)
    - Type assertions: `v, ok := x.(int)` (ok is false on type mismatch)

  Real config-loading libraries do exactly this layered lookup
  with sources like `flag` → `os.Getenv` → file → default. The
  shape is identical, just with different lookup primitives.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#comma_ok_section"
