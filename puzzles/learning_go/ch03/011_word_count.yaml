id: "lg-ch03-011"
title: "Word Count"
concept: "maps"
description: |
  Maps return the zero value for missing keys, which makes counter
  maps trivial: `counts[word]++` works on first sight because the
  read sees 0, then the write sets it to 1.

  Implement `wordCount(words)` that returns a map from each word to
  how many times it appears in the slice.

      wordCount([]string{"a", "b", "a", "c", "b", "a"}) ==
          map[string]int{"a": 3, "b": 2, "c": 1}
      wordCount(nil) == map[string]int{}
template: |
