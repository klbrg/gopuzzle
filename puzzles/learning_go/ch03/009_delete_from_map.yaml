id: "lg-ch03-009"
title: "Removing a Key From a Map"
concept: "maps"
kind: "quiz"
description: |
  Maps don't have methods. Operations like reading, writing, and
  removing entries use built-in syntax or built-in functions. Pick
  the correct way to remove a key.
question: "Given `m := map[string]int{\"a\": 1}`, which removes the key `\"a\"`?"
choices:
  - 'delete(m, "a")'
  - 'm["a"] = nil'
  - 'm.Remove("a")'
  - 'm["a"]--'
answer: 'delete(m, "a")'
hint: "`delete` is a built-in function. It takes the map and the key, and silently does nothing if the key isn't present."
explanation: |
  `delete(m, key)` is the only way to remove a key/value pair. It is
  safe on a nil map (does nothing) and safe on a missing key (also
  does nothing — no error).

  Why these don't work:
    m["a"] = nil   — nil isn't the zero value for int, this is a
                     compile error. For `map[string]any` it would
                     "delete" the value in a sense, but the key
                     would still be in the map.
    m.Remove("a")  — maps have no methods.
    m["a"]--       — this just sets m["a"] to its current value
                     minus one (and brings it into the map if it
                     wasn't there).
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#id41"
