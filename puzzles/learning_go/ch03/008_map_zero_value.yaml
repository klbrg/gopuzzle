id: "lg-ch03-008"
title: "Map: Zero Value for Missing Keys"
concept: "maps"
kind: "predict_output"
description: |
  Predict the output. The map starts with one entry. The script
  reads three keys; only one of them was explicitly set.
snippet: |
  package main

  import "fmt"

  func main() {
  	m := map[string]int{"x": 1}
  	m["y"]++
  	fmt.Println(m["missing"])
  }
expected_output: |
  0
hint: "Two of the three reads are for keys that aren't in the map. Does that panic, return some sentinel, or something else? Trace `m[\"y\"]++` carefully — it reads, then writes."
explanation: |
  Maps return the zero value for any missing key. For `int`, that's
  0; for `bool`, false; for `string`, the empty string; for a slice
  or pointer, nil. This makes counter-style maps clean:
    counts := map[string]int{}
    counts[word]++   // even on first sight, counts[word] is 0

  If you need to *distinguish* "key absent" from "key present with the
  zero value", use the comma-ok idiom: `v, ok := m[key]`.

  Writing to a nil map (`var m map[string]int; m["x"] = 1`) panics —
  always initialize with a literal `{}` or `make`.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#id221"
