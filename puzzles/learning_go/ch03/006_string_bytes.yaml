id: "lg-ch03-006"
title: "Strings Are Bytes, Not Runes"
concept: "strings"
kind: "predict_output"
description: |
  A Go string is a sequence of bytes. When you index one with `s[i]`,
  you get back a single byte — not a character, not a rune. The `%T`
  format verb prints the underlying type of a value.

  Predict the output.
snippet: |
  package main

  import "fmt"

  func main() {
  	s := "Hi"
  	fmt.Printf("%T\n", s[0])
  }
expected_output: |
  uint8
hint: "`byte` is just an alias for one of Go's predeclared integer types. `%T` prints the underlying type, not the alias."
explanation: |
  `s[i]` returns a `byte`. `byte` is an alias for `uint8`, so `%T`
  prints `uint8` (the underlying named type) rather than `byte`.

  Because the result is a number, if you ever wrote
  `fmt.Println(s[0])` you'd see a decimal value (e.g. 72 for 'H'),
  not the character. To get a character at a position, iterate with
  `for i, r := range s` (which decodes UTF-8 code points) or convert
  the string to `[]rune`. Indexing into a string with `[i]` is
  byte-level — you can land mid-character on multi-byte runes
  (emojis, accented letters).
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#strings_runes_bytes"
