id: "lg-ch03-007"
title: "Converting int to string"
concept: "strings"
kind: "predict_output"
description: |
  This snippet converts an integer to a string with `string(n)`,
  measures the length of the resulting string, and compares it to
  the digit text "65". Predict the output.
snippet: |
  package main

  import "fmt"

  func main() {
  	n := 65
  	s := string(n)
  	fmt.Println(len(s))
  }
expected_output: |
  1
hint: "`string(intValue)` doesn't return the digit text. It returns something else — figure out what, and the length and comparison fall out from that."
explanation: |
  `string(intValue)` interprets the integer as a Unicode code point
  and returns the corresponding one-rune UTF-8 string. So
  `string(65)` is the one-character string for the letter 'A', not
  the two-character digit text "65". That's why:
    - `len(s)` is 1 (one character, encoded as 1 byte because the
      code point is in the ASCII range), not 2.
    - `s == "65"` is false — different strings entirely.

  Since Go 1.15 `go vet` warns when you do this conversion with a
  plain `int`, exactly to flag the gotcha. The fixes:
    - To convert a code point to a character: `string(rune(n))` makes
      the intent explicit and quiets the warning.
    - To convert a number to its decimal text: `strconv.Itoa(n)`.
reference: "https://learning.oreilly.com/library/view/learning-go-2nd/9781098139285/ch03.html#strings_runes_bytes"
