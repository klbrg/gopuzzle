id: "ep-examples-003"
title: "Late Binding in Closures"
concept: "closures"
kind: "fix"
description: |
  Lambdas (and nested `def`s) capture variables by reference, not
  by value. The code below builds three lambdas inside a loop that
  should return 0, 1, and 2 — but they don't. Fix the lambda so
  the program prints the right values.
template: |
  fns = []
  for i in range(3):
      # BUG: every lambda captures the same `i`, so by the time we
      # call any of them, `i` has already advanced to 2.
      fns.append(lambda: i)

  for fn in fns:
      print(fn())
expected_output: |
  0
  1
  2
hint: "Bind `i` at lambda definition time by using it as a default-argument value: `lambda i=i: i`. Default args are evaluated once, when the lambda is created."
solution: |
  fns = []
  for i in range(3):
      fns.append(lambda i=i: i)

  for fn in fns:
      print(fn())
explanation: |
  Closures in Python (and lambdas, which are just expression-level
  functions) capture *names*, not values. When the loop finishes,
  `i` is `2`, and every lambda — which all reference that same name —
  resolves it to `2` when called.

  The default-argument trick (`lambda i=i: i`) works because default
  arguments are evaluated and bound exactly once, at the moment the
  lambda is created. By the time you call the lambda, its parameter
  `i` already holds the value it had when defined.

  Other idiomatic fixes include:
    - Using a helper function: `def make_fn(i): return lambda: i`
    - Using `functools.partial`: `partial(lambda i: i, i)`

  This is the same gotcha that Go had with its for-loop variable
  semantics before Go 1.22.
reference: "https://learning.oreilly.com/library/view/effective-python-third/9780138177263/"
