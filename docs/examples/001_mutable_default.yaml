id: "ep-examples-001"
title: "Mutable Default Arguments"
concept: "data_model"
kind: "predict_output"
description: |
  Python evaluates a function's default arguments once, at function
  definition time. So a default argument that is a mutable object
  (a list, a dict, etc.) is shared across every call that doesn't
  pass a value.

  Predict the output.
snippet: |
  def append_one(items=[]):
      items.append(1)
      return items

  print(append_one())
  print(append_one())
  print(append_one())
expected_output: |
  [1]
  [1, 1]
  [1, 1, 1]
hint: "The default `[]` is created ONCE at def time and reused by every call. The same list grows on each call."
explanation: |
  Mutable default arguments are one of Python's most-cited gotchas.
  The default value is built when the function is defined, not when
  it is called. So every call without an `items` argument receives a
  reference to the same shared list.

  The idiomatic fix is to use `None` as a sentinel and create a fresh
  list inside the function:

      def append_one(items=None):
          if items is None:
              items = []
          items.append(1)
          return items

  This is *Effective Python* Item 24's territory ("Never use mutable
  default arguments").
reference: "https://learning.oreilly.com/library/view/effective-python-third/9780138177263/ch04.xhtml#ch04item24"
